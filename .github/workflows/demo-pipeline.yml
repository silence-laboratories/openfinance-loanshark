  deploy-fe:
    runs-on: openfinance-demo-deployer
    needs: [build-fe]
    steps:
      - run: |
          docker rm -f openfinance-loanshark
          docker run -p 3000:3000 -d --restart always --name openfinance-loanshark ghcr.io/silence-laboratories/openfinance-loanshark-fe:demo
